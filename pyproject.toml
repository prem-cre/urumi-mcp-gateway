[project]
name = "urumi-mcp-gateway"
version = "0.1.0"
description = "Team MCP gateway and WooCommerce tools, deployed with Helm"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mcp>=1.28,<2",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "cryptography>=44,<47",
  "argon2-cffi>=23,<26",
  "jsonschema>=4.23,<5",
  "email-validator>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "pyjwt[crypto]>=2.10,<3",
]
[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.uv]
package = false
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
