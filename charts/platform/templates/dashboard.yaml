{{- if and .Values.gateway.enabled .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard, instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: dashboard, instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image | quote }}
          imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: nginx-cache, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: dashboard, instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  ingressClassName: {{ .Values.store.ingress.className }}
  {{- if .Values.gateway.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.gateway.dashboardHost | quote }}]
      secretName: {{ .Values.gateway.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.dashboardHost | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-gateway, port: {name: http}}
          - path: /mcp
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-gateway, port: {name: http}}
          - path: /healthz
            pathType: Exact
            backend:
              service: {name: {{ .Release.Name }}-gateway, port: {name: http}}
          - path: /readyz
            pathType: Exact
            backend:
              service: {name: {{ .Release.Name }}-gateway, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-dashboard, port: {name: http}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  podSelector:
    matchLabels: {app: dashboard, instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{port: 8080, protocol: TCP}]
{{- end }}
{{- end }}
