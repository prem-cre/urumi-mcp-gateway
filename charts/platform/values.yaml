global:
  environment: local
  storageClass: local-path
store:
  host: store.localhost
  url: http://store.localhost:8080
  title: Urumi Demo Store
  ingress:
    className: traefik
    tlsSecretName: ""
  existingSecret: urumi-store
  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    storage: 2Gi
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 768Mi}
  database:
    image: mariadb:11.4.13
    storage: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
  bootstrap:
    enabled: true
    image: wordpress:cli-php8.3
    woocommerceVersion: "11.2.1"
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 768Mi}
gatewayDatabase:
  enabled: true
  existingSecret: urumi-gateway-db
  image: postgres:17.11
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
gateway:
  enabled: false
  image: urumi/gateway:0.2.0
  imagePullPolicy: IfNotPresent
  existingSecret: urumi-gateway-app
  adminEmail: admin@example.test
  adminName: Workspace Admin
  dashboardHost: gateway.localhost
  mcpAllowedHosts: []
  mcpAllowedOrigins: []
  tlsSecretName: ""
  sessionCookieSecure: false
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
  toolTimeoutSeconds: 20
  discoveryTimeoutSeconds: 5
  probeIntervalSeconds: 30
  apiRpmLimit: 120
  llm:
    baseUrl: ""
    model: ""
    routerModel: ""
    standardModel: ""
    complexModel: ""
    analysisModel: ""
    providerName: OpenAI-compatible endpoint
    modelPricing: {}
  observability:
    captureContent: false
    traceContentRetentionDays: 7
    analysisPollSeconds: 2
    analysisLeaseSeconds: 180
    analysisTimeoutSeconds: 60
    analysisMaxOutputTokens: 1200
    analysisMaxTraces: 25
demoMcp:
  enabled: false
  image: urumi/demo-mcp:0.2.0
  imagePullPolicy: IfNotPresent
  existingSecret: urumi-gateway-app
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 192Mi}
dashboard:
  enabled: false
  image: urumi/dashboard:0.2.0
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
networkPolicy:
  enabled: true
woocommerceMcp:
  enabled: false
  image: urumi/woocommerce-mcp:0.1.0
  imagePullPolicy: IfNotPresent
  existingSecret: urumi-woocommerce-mcp
  storeUrl: "" # default: release WordPress internal Service
  timezone: Asia/Kolkata
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
