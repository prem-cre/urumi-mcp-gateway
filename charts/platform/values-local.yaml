global:
  environment: local
  storageClass: local-path
store:
  host: store.localhost
  url: http://store.localhost:8080
  ingress:
    className: traefik
gateway:
  dashboardHost: gateway.localhost
  mcpAllowedHosts:
    - gateway.localhost:*
    - localhost:*
    - 127.0.0.1:*
  mcpAllowedOrigins:
    - http://gateway.localhost:8080
    - http://localhost:*
    - http://127.0.0.1:*
  sessionCookieSecure: false
  observability:
    # Local assessment data is synthetic; content is still redacted and expires after 7 days.
    captureContent: true
    traceContentRetentionDays: 7
  llm:
    # Gemini's OpenAI-compatible endpoint; key remains in urumi-gateway-app Secret.
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.8-flash
    routerModel: ""
    # The deterministic route heuristic remains enabled; both tiers use Flash for the demo.
    standardModel: gemini-3.8-flash
    complexModel: gemini-3.8-flash
    analysisModel: gemini-3.8-flash
    providerName: Google Gemini API
    # Published standard rates in USD per 1M tokens; dashboard costs are estimates.
    modelPricing:
      gemini-3.8-flash:
        input_per_million: 0.75
        output_per_million: 3.75
